name: tiebaSign

on:
  push:
  workflow_dispatch:
  schedule:
    # UTC 时间，00:05 UTC = 北京时间 08:05 / 日本时间 09:05
    - cron: '05 00 * * *'

jobs:
  TiebaSignIn:
    runs-on: ubuntu-latest
    # 正常约 1-8 分钟（取决于关注的贴吧数量），留足余量防止卡死
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Sign in
        env:
          # 凭证一律走环境变量，不放命令行参数（进程列表里可见）
          BDUSS: ${{ secrets.BDUSS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: go run .
