name: tiebaSign

on:
  push:
  workflow_dispatch:
  schedule:
    # 09:37 日本 / 08:37 北京
    - cron: '37 0 * * *'
    # 14:23 日本 / 13:23 北京
    - cron: '23 5 * * *'
    # 临时诊断槽位，验证 GitHub 是否会派发本仓库的 schedule，确认后删除
    - cron: '7 7 * * *'

jobs:
  TiebaSignIn:
    runs-on: ubuntu-latest
    # 正常约 1-8 分钟（取决于关注的贴吧数量），留足余量防止卡死
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Sign in
        env:
          # 凭证一律走环境变量，不放命令行参数（进程列表里可见）
          BDUSS: ${{ secrets.BDUSS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: go run .
