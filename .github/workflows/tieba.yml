name: tiebaSign

on:
  push:
  workflow_dispatch:
  schedule:
    # UTC 时间。刻意避开 00:00 UTC 前后 —— 那是全站 cron 最拥堵的时刻，
    # GitHub 高负载时会直接丢弃调度，且不留任何记录（无 run、无报错、无通知）。
    # 两个槽位互为兜底：已签到的吧在 getFollow 里就被跳过，重复执行幂等。
    - cron: '37 00 * * *'   # 09:37 日本 / 08:37 北京
    - cron: '23 05 * * *'   # 14:23 日本 / 13:23 北京

jobs:
  TiebaSignIn:
    runs-on: ubuntu-latest
    # 正常约 1-8 分钟（取决于关注的贴吧数量），留足余量防止卡死
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Sign in
        env:
          # 凭证一律走环境变量，不放命令行参数（进程列表里可见）
          BDUSS: ${{ secrets.BDUSS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: go run .
