name: keepalive

# 公开仓库连续 60 天无活动，schedule 触发的 workflow 会被 GitHub 自动禁用。
# 这个 workflow 每月推一次空提交来规避。不需要的话直接删掉本文件。

on:
  workflow_dispatch:
  schedule:
    # 每月 1 号 08:19 UTC = 16:19 北京。避开整点和 00:00 UTC 拥堵段。
    - cron: '19 08 1 * *'

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Push empty commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive"
          git push
