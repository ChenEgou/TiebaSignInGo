name: Delete old workflow runs

on:
  workflow_dispatch:
  schedule:
    # 每月 1 号 06:41 UTC = 15:41 日本 / 14:41 北京。
    # 避开整点和 00:00 UTC 拥堵段；排在当天两个签到槽位(00:37 / 05:23 UTC)之后，
    # 免得刚跑完的签到记录还没看就被清掉。
    - cron: '41 06 1 * *'

# 需要写权限才能删除运行记录
permissions:
  actions: write
  contents: read

jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          # 删掉 7 天前的旧记录，但无论如何保留最近 5 条。
          # 留够证据排查「定时任务到底跑没跑」—— 别把自己的追溯手段也清掉。
          retain_days: 7
          keep_minimum_runs: 5
