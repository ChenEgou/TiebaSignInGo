name: Delete old workflow runs

on:
  workflow_dispatch:

# 需要写权限才能删除运行记录
permissions:
  actions: write
  contents: read

jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        # 注意：retain_days: 0 配合 keep_minimum_runs: 0 会清空全部运行记录，
        # 一条都不保留。本 workflow 仅手动触发，不会自动执行。
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
