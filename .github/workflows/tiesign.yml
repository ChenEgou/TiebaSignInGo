name: tiesign

on:
  push:
  workflow_dispatch:
  schedule:
    # 与老仓库 TiebaSignIn 保持完全一致，用于 A/B 对照
    # 00:05 UTC = 北京 08:05 / 日本 09:05
    - cron: '05 00 * * *'

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Sign in
        env:
          BDUSS: ${{ secrets.BDUSS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: go run .
