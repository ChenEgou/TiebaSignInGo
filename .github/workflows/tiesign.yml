name: tiesign

on:
  push:
  workflow_dispatch:
  schedule:
    # 18:17 UTC = 日本 03:17 / 北京 02:17
    # 避开整点和 00:00 UTC 这两个 GitHub 定时任务最拥挤的时段，减少延迟和被丢弃。
    # 贴吧按北京时间算一天，北京凌晨就开跑，就算延迟很久也不会错过当天。
    - cron: '17 18 * * *'

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Sign in
        env:
          BDUSS: ${{ secrets.BDUSS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: go run .
